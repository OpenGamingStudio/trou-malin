# Site statique Trou Malin : en-têtes de sécurité HTTP.
# Attention : un add_header dans un bloc location annule ceux du server ;
# toute location qui en ajoute un doit répéter toute la liste (snippet inclus).

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/conf.d/security-headers.inc;

    # Tout ce qui n'a pas d'empreinte (index.html, version.json, icônes) se revalide à chaque ouverture :
    # sans cela le navigateur garde une ancienne page « fraîche » (cache heuristique) et le jeu ne se met pas à jour.
    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    location = /sw.js {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
        types { }
        default_type application/javascript;
        try_files $uri =404;
    }

    location = /version.json {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # nginx 1.27 ne connaît pas l'extension .webmanifest
    location = /manifest.webmanifest {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
        types { }
        default_type application/manifest+json;
    }

    # Fichiers à empreinte de Vite : cache long
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Interdit les fichiers cachés, sauf /.well-known.
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }
}
